<button
  type="button"
  class="scroll-top-btn"
  [class.visible]="isVisible()"
  (click)="scrollToTop()"
  aria-label="Scroll to top of page"
>
  <!-- Circular Progress Ring -->
  <svg class="progress-ring-svg" viewBox="0 0 56 56">
    <circle class="progress-ring-bg" cx="28" cy="28" r="24" />
    <circle
      class="progress-ring-fill"
      cx="28"
      cy="28"
      r="24"
      [style.strokeDashoffset]="strokeDashoffset()"
    />
  </svg>

  <!-- Rocket Icon -->
  <span class="scroll-icon-wrapper">
    <svg class="rocket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
      <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
      <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
      <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
    </svg>
  </span>

  <!-- Progress % Label -->
  <span class="scroll-progress-label">{{ progressPercent() }}%</span>
</button>
